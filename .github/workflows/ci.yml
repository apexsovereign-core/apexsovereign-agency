name: ApexSovereign Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/app backend/tests

      - name: Run Test Suite
        run: |
          PYTHONPATH=backend pytest backend/tests -v

      - name: Validate vercel.json
        run: |
          python -c "import json; json.load(open('vercel.json'))"
          echo "vercel.json is valid JSON."

      - name: Dependency Audit
        run: |
          pip-audit -r backend/requirements.txt || echo "Audit completed with review flags"
