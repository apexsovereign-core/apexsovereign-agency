; ==============================================================================
; APEXSOVEREIGN.AI — PRODUCTION PGBOUNCER TRANSACTION POOLING CONFIGURATION
; Path: config/pgbouncer.ini
; Strategy: Transaction-Level Pooling for Extreme Concurrency & Zero Exhaustion
; ==============================================================================

[databases]
; Forward connection to live Supabase / PostgreSQL cluster
apexsovereign_production = host=db.apexsovereign.supabase.internal port=5432 dbname=postgres auth_user=postgres

[pgbouncer]
; Administrative listen interfaces
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, supabase_admin
stats_users = prometheus_exporter

; ==============================================================================
; POOLING ARCHITECTURE & CONCURRENCY SCALING
; ==============================================================================
; Transaction mode releases server connection immediately after commit/rollback
pool_mode = transaction

; Scale client ingress to 10,000 concurrent API microservices
max_client_conn = 10000

; Backend database connection ceiling (100 dedicated Postgres connections)
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 15
reserve_pool_timeout = 1.0
max_db_connections = 120

; ==============================================================================
; TIMEOUT SAFEGUARDS & STARVATION MITIGATION
; ==============================================================================
; Terminate rogue long-running queries blocking row locks
query_timeout = 5.0

; Abort orphaned transactions lingering without commit
idle_transaction_timeout = 10.0

; Close unused backend connections to reclaim resources
server_idle_timeout = 60.0

; Disconnect stalled clients after inactivity
client_idle_timeout = 120.0

; Maximum time client waits in queue before aborting
query_wait_timeout = 15.0

; Health probe interval
server_check_interval = 10.0
server_check_query = SELECT 1;

; ==============================================================================
; PERFORMANCE TUNING & LOW-LATENCY PACKET DELIVERY
; ==============================================================================
tcp_defer_accept = 1
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10

; Prepared statement support in transaction pooling
max_prepared_statements = 200
