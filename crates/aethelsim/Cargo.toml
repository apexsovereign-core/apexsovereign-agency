[package]
name = "aethelsim"
version = "1.0.0"
edition = "2021"
authors = ["ApexSovereign Holdings Architecture Team"]
description = "10-Year Planetary Simulation Engine & Monte Carlo Resource Forecaster"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
