[package]
name = "multimodal"
version = "1.0.0"
edition = "2021"
authors = ["ApexSovereign AI Infrastructure <dev@apexsovereign.ai>"]
description = "Multi-Modal Sovereign Intelligence Services and Real-Time Transcription Mesh for ApexSovereign.ai"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.7", features = ["macros", "ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
async-trait = "0.1"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"

[lib]
name = "multimodal"
path = "src/lib.rs"
