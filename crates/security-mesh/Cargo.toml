[package]
name = "security-mesh"
version = "0.1.0"
edition = "2021"
authors = ["ApexSovereign Engineering <security@apexsovereign.ai>"]
description = "Zero-Trust mTLS Service Mesh & Automated X.509 Identity Authority for ApexSovereign"

[dependencies]
tokio = { version = "1.38", features = ["full", "sync", "time"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util", "layer"] }
tower-http = { version = "0.5", features = ["trace"] }
http = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
