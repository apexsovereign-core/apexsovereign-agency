[package]
name = "sovereign-operator"
version = "1.0.0"
edition = "2021"
authors = ["ApexSovereign Systems Engineering <operator@apexsovereign.ai>"]
description = "Sovereign Fleet Command & Four-Tier Production Operator Binary"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "tokio", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
async-trait = "0.1"
thiserror = "1.0"
bytes = "1.6"
http = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "sovereign-operator"
path = "src/main.rs"
