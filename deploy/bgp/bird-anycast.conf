# ============================================================================
# ApexSovereign.ai - PRODUCTION BIRD 2 ANYCAST BGP DAEMON CONFIGURATION
# File: deploy/bgp/bird-anycast.conf
# Target: BIRD Internet Routing Daemon v2.0+ (Bare-Metal Edge Ingress)
# Functionality: Multi-Homed Anycast BGP with Automated Sub-Second Failover
# ============================================================================

# Global System Logging & Router Identity
log syslog { info, warning, error, fatal };
log "/var/log/bird.log" { error, fatal, warning };

router id 198.51.100.1;
define SOVEREIGN_ASN = 65001;
define PEER_COMMUNITY_DRAIN = (SOVEREIGN_ASN, 666);
define PEER_COMMUNITY_LOCAL = (SOVEREIGN_ASN, 100);

# Sovereign Anycast CIDRs
define APEX_IPV4_PREFIX = 198.51.100.0/24;
define APEX_IPV6_PREFIX = 2001:db8:apex::/48;

# ----------------------------------------------------------------------------
# 1. CORE ROUTING TABLES & SYSTEM PROTOCOLS
# ----------------------------------------------------------------------------
ipv4 table master4;
ipv6 table master6;

# Device protocol tracks interface link states
protocol device {
    scan time 2;
}

# Direct protocol monitors the Sovereign dummy Anycast interface
protocol direct anycast_vip4 {
    ipv4 {
        table master4;
        import filter {
            # Only import Anycast VIP when dummy0 interface is operational
            if ifname = "dummy0" && net = APEX_IPV4_PREFIX then {
                bgp_community.add((SOVEREIGN_ASN, 1000));
                accept;
            }
            reject;
        };
    };
    interface "dummy0";
}

protocol direct anycast_vip6 {
    ipv6 {
        table master6;
        import filter {
            if ifname = "dummy0" && net = APEX_IPV6_PREFIX then {
                bgp_community.add((SOVEREIGN_ASN, 1000));
                accept;
            }
            reject;
        };
    };
    interface "dummy0";
}

# Kernel synchronization protocol with Multi-Path ECMP enabled
protocol kernel kernel4 {
    ipv4 {
        table master4;
        export filter {
            if source = RTS_BGP then accept;
            reject;
        };
    };
    learn;
    merge paths on; # ECMP 64-way multi-path hashing
    metric 64;
}

protocol kernel kernel6 {
    ipv6 {
        table master6;
        export filter {
            if source = RTS_BGP then accept;
            reject;
        };
    };
    learn;
    merge paths on;
    metric 64;
}

# ----------------------------------------------------------------------------
# 2. BFD (BIDIRECTIONAL FORWARDING DETECTION) PROTOCOL
# ----------------------------------------------------------------------------
protocol bfd sovereign_bfd {
    interface "*" {
        interval 50 ms;
        min rx interval 50 ms;
        multiplier 3;
    };
    multihop {
        min rx interval 100 ms;
        multiplier 3;
    };
}

# ----------------------------------------------------------------------------
# 3. TRANSIT ROUTE FILTERS & HEALTH GUARD
# ----------------------------------------------------------------------------
filter apex_outbound_ipv4 {
    # Fail-safe: Check if health sentinel file exists and node is not drained
    if ! (net = APEX_IPV4_PREFIX) then {
        reject; # Zero leakage of internal, tenant, or local LAN subnets
    }

    # Graceful Maintenance Drain (Community RFC 8326)
    if (SOVEREIGN_ASN, 666) ~ bgp_community then {
        bgp_path.prepend(SOVEREIGN_ASN);
        bgp_path.prepend(SOVEREIGN_ASN);
        bgp_path.prepend(SOVEREIGN_ASN);
        bgp_med = 1000;
    } else {
        bgp_med = 10;
    }

    bgp_community.add(PEER_COMMUNITY_LOCAL);
    accept;
}

filter apex_outbound_ipv6 {
    if ! (net = APEX_IPV6_PREFIX) then {
        reject;
    }

    if (SOVEREIGN_ASN, 666) ~ bgp_community then {
        bgp_path.prepend(SOVEREIGN_ASN);
        bgp_path.prepend(SOVEREIGN_ASN);
        bgp_med = 1000;
    } else {
        bgp_med = 10;
    }

    accept;
}

# ----------------------------------------------------------------------------
# 4. BGP UPSTREAM TEMPLATES
# ----------------------------------------------------------------------------
template bgp TRANSIT_UPSTREAM_V4 {
    local as SOVEREIGN_ASN;
    bfd on;
    graceful restart on;
    connect retry time 5;
    hold time 15;
    keepalive time 5;
    ipv4 {
        table master4;
        import none; # Ingress Anycast edge only advertises Sovereign prefixes
        export filter apex_outbound_ipv4;
    };
}

template bgp TRANSIT_UPSTREAM_V6 {
    local as SOVEREIGN_ASN;
    bfd on;
    graceful restart on;
    connect retry time 5;
    hold time 15;
    keepalive time 5;
    ipv6 {
        table master6;
        import none;
        export filter apex_outbound_ipv6;
    };
}

# ----------------------------------------------------------------------------
# 5. TRANSIT PEER SESSIONS (TIER 1 GLOBAL BACKBONES)
# ----------------------------------------------------------------------------

# Peer 1: Arelion / Telia Carrier (AS1299)
protocol bgp arelion_primary_v4 from TRANSIT_UPSTREAM_V4 {
    description "Arelion AS1299 Direct Transit Primary";
    neighbor 198.18.0.1 as 1299;
}

protocol bgp arelion_primary_v6 from TRANSIT_UPSTREAM_V6 {
    description "Arelion AS1299 Direct Transit IPv6";
    neighbor 2001:db8:1299::1 as 1299;
}

# Peer 2: Lumen / Level 3 (AS3356)
protocol bgp lumen_secondary_v4 from TRANSIT_UPSTREAM_V4 {
    description "Lumen AS3356 Secondary Transit";
    neighbor 198.18.1.1 as 3356;
}

protocol bgp lumen_secondary_v6 from TRANSIT_UPSTREAM_V6 {
    description "Lumen AS3356 Secondary Transit IPv6";
    neighbor 2001:db8:3356::1 as 3356;
}

# Peer 3: Cogent Communications (AS174)
protocol bgp cogent_v4 from TRANSIT_UPSTREAM_V4 {
    description "Cogent AS174 Edge Transit";
    neighbor 198.18.2.1 as 174;
}

# Peer 4: Equinix Metal Direct / Local Edge Gateway (AS13414)
protocol bgp equinix_local_v4 from TRANSIT_UPSTREAM_V4 {
    description "Equinix Metal Local Edge Gateway";
    neighbor 10.0.0.1 as 13414;
    default bgp_med 5;
}
