# ============================================================================
# ApexSovereign.ai - PRODUCTION TRAEFIK INGRESS GATEWAY
# Manifest: deploy/ingress/traefik-gateway.yaml
# Features: HTTP/3 (QUIC) & TLS 1.3, Per-Tenant Rate Limiting, Leaky Bucket
#           Protection, Weighted GPU Node Balancing, 300s Streaming Read Timeouts.
# ============================================================================

http:
  # --------------------------------------------------------------------------
  # 1. ROUTERS
  # --------------------------------------------------------------------------
  routers:
    # Primary public streaming ingress endpoint
    streaming-inference-router:
      rule: "Host(`api.apexsovereign.ai`) && PathPrefix(`/v1/chat/completions`, `/v1/completions`)"
      entryPoints:
        - "websecure"
      service: "streaming-gateway-service"
      middlewares:
        - "security-headers"
        - "tenant-rate-limit"
        - "streaming-in-flight-concurrency"
        - "streaming-timeout-tuning"
      tls:
        certResolver: "letsencrypt"
        options: "tls-hardening-v13"

    # Gateway health check probe router
    health-router:
      rule: "Host(`api.apexsovereign.ai`) && Path(`/healthz`)"
      entryPoints:
        - "websecure"
      service: "streaming-gateway-service"
      tls:
        certResolver: "letsencrypt"

  # --------------------------------------------------------------------------
  # 2. MIDDLEWARES
  # --------------------------------------------------------------------------
  middlewares:
    # Strict TLS and CORS Security Headers
    security-headers:
      headers:
        sslRedirect: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        customResponseHeaders:
          X-Powered-By: "ApexSovereign-Edge-Gateway"
          Server: "ApexSovereign-vCU"

    # Per-Tenant Token Leaky Bucket Rate Limiter
    # 200 requests/sec average with a burst capacity of 500 requests
    tenant-rate-limit:
      rateLimit:
        average: 200
        burst: 500
        period: "1s"
        sourceCriterion:
          requestHeaderName: "Authorization"

    # In-Flight Concurrency Governor: Prevents thread starvation on long streaming sessions
    streaming-in-flight-concurrency:
      inFlightReq:
        amount: 2500
        sourceCriterion:
          requestHeaderName: "Authorization"

    # Custom Buffering & Timeout Overrides for LLM Server-Sent Events (SSE)
    # Buffering is disabled to preserve sub-millisecond per-token streaming latency
    streaming-timeout-tuning:
      buffering:
        maxRequestBodyBytes: 10485760 # 10MB prompt limit
        memRequestBodyBytes: 2097152   # 2MB memory buffer
        maxResponseBodyBytes: 0        # 0 disables response buffering for SSE
        memResponseBodyBytes: 0

  # --------------------------------------------------------------------------
  # 3. SERVICES & LOAD BALANCING
  # --------------------------------------------------------------------------
  services:
    streaming-gateway-service:
      loadBalancer:
        sticky:
          cookie:
            name: "apex_gateway_affinity"
            secure: true
            httpOnly: true
            sameSite: "none"
        passHostHeader: true
        responseForwarding:
          flushInterval: "1ms" # Sub-millisecond chunk flush for SSE
        servers:
          - url: "http://10.240.0.10:3000"
            weight: 100
          - url: "http://10.240.0.11:3000"
            weight: 100
          - url: "http://10.240.0.12:3000"
            weight: 80
        healthCheck:
          path: "/healthz"
          interval: "2s"
          timeout: "500ms"
          scheme: "http"

  # --------------------------------------------------------------------------
  # 4. TRANSPORT CONFIGURATION & TIMEOUTS
  # --------------------------------------------------------------------------
  serversTransports:
    streaming-transport:
      serverName: "streaming.internal.apexsovereign.ai"
      insecureSkipVerify: false
      maxIdleConnsPerHost: 200
      forwardingTimeouts:
        dialTimeout: "3s"
        responseHeaderTimeout: "10s"
        idleConnTimeout: "90s"
        readTimeout: "300s" # 5-minute maximum generation window for large models

# ----------------------------------------------------------------------------
# 5. TLS 1.3 & HTTP/3 (QUIC) HARDENED CIPHERSUITE
# ----------------------------------------------------------------------------
tls:
  options:
    tls-hardening-v13:
      minVersion: "VersionTLS13"
      sniStrict: true
      cipherSuites:
        - "TLS_AES_128_GCM_SHA256"
        - "TLS_AES_256_GCM_SHA384"
        - "TLS_CHACHA20_POLY1305_SHA256"
      curvePreferences:
        - "X25519"
        - "SecP256r1"
        - "SecP384r1"
      alpnProtocols:
        - "h3"
        - "h2"
        - "http/1.1"
