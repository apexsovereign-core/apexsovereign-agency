version: "3.9"

networks:
  apex-compute-mesh:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

services:
  # Universal Heterogeneous Compute Router & Virtual GPU Engine
  compute-mesh-daemon:
    image: apexsovereign/compute-mesh:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.compute-mesh
    container_name: apex-compute-mesh-daemon
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - RUST_LOG=info,compute_mesh=debug
      - MESH_PORT=8090
      - FAILOVER_RETRY_TIMEOUT_MS=10
      - WARM_CACHE_TTL_SECS=60
    networks:
      apex-compute-mesh:
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Upstream Worker Simulator 1: AWS p5.48xlarge (8x H100 80GB)
  worker-aws-h100:
    image: python:3.10-slim
    container_name: apex-worker-aws-h100
    restart: unless-stopped
    command: >
      python3 -c "
      import http.server, socketserver, json
      class H(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(json.dumps({'status': 'completed', 'tokens': 256, 'cost': 0.00018}).encode())
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'OK')
      socketserver.TCPServer(('0.0.0.0', 9001), H).serve_forever()
      "
    ports:
      - "9001:9001"
    networks:
      apex-compute-mesh:
        ipv4_address: 172.29.0.21

  # Upstream Worker Simulator 2: GCP A3 HighGPU (8x H100 80GB)
  worker-gcp-h100:
    image: python:3.10-slim
