      class H(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(json.dumps({'status': 'completed', 'tokens': 256, 'cost': 0.00019}).encode())
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'OK')
      socketserver.TCPServer(('0.0.0.0', 9002), H).serve_forever()
      "
    ports:
      - "9002:9002"
    networks:
