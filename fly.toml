# ==============================================================================
# APEXSOVEREIGN.AI — FLY.IO EDGE ORCHESTRATION MANIFEST
# App: apexsovereign-mesh
# Regions: iad (Virginia Primary), ord (Chicago Backup), arn (Stockholm Geothermal)
# ==============================================================================
app = "apexsovereign-mesh"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.axum"

[env]
  PORT = "8080"
  RUST_LOG = "info,aethelmesh_core=debug"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2500
    soft_limit = 2000

[[http_service.checks]]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  timeout = "2s"
  path = "/health"

[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 2048
