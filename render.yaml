services:
  - type: web
    name: apex-ingestion-engine
    env: python
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PATH
        value: "/opt/render/project/.venv/bin:/opt/render/project/src/.venv/bin:/usr/local/bin:/usr/bin:/bin"
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_NODE
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INGESTION_WEBHOOK_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://apexsovereign.ai,https://*.vercel.app"
