services:
  - type: pserv
    name: apex-lead-hunter-daemon
    env: python
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install httpx pydantic fastapi uvicorn"
    startCommand: "python3 backend/agents/lead_hunter_daemon.py"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
