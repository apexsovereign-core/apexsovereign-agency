[package]
name = "apex_ingestion_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { version = "1.5", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
